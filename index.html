<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

.container {
    background-color: rgb(236, 171, 171);
    min-height: 100vh;
    display: flex;
    flex-direction: column;   
    align-items: center;
    gap: 16px;
    padding: 16px;
}

.box {
    display: flex;            
    width: 100%;
    max-width: 800px;
    height: 180px;
    background-color: rgb(166, 197, 197);
    border: 2px solid rgb(240, 240, 255);
    border-radius: 8px;
    overflow: hidden;
}

.box img {
    height: 100%;
    width: 320px;
    object-fit: cover;        
    flex-shrink: 0;
}

.info {
    padding: 12px;
    color: #222;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.title {
    font-size: 18px;
}

.chName {
    font-size: 14px;
    color: #444;
}
    </style>
</head>
<body>
    <div class="container"></div>
    <script src="card.js"></script>
</body>
</html>
